<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- cake base -->
  <rect x="10" y="36" width="44" height="20" rx="4" fill="#F9A8D4"/>
  <!-- frosting -->
  <path d="M10 40 Q16 32 22 40 Q28 32 34 40 Q40 32 46 40 Q52 32 54 40" fill="none" stroke="#EC4899" stroke-width="3" stroke-linecap="round"/>
  <!-- candle -->
  <rect x="29" y="20" width="6" height="18" rx="2" fill="#FBBF24"/>
  <!-- flame -->
  <ellipse cx="32" cy="17" rx="4" ry="6" fill="#F97316"/>
  <ellipse cx="32" cy="16" rx="2" ry="3" fill="#FDE68A"/>
  <!-- heart decorations -->
  <text x="18" y="50" font-size="8" fill="#EC4899">♥</text>
  <text x="40" y="50" font-size="8" fill="#EC4899">♥</text>
  <!-- sparkles -->
  <text x="8" y="14" font-size="10">✨</text>
  <text x="48" y="14" font-size="10">✨</text>
